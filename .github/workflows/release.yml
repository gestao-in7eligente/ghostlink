# Release pipeline (spec §15). A protected v<X.Y.Z> tag builds the Windows installer, the VPS
# server package and the bots' discord.js compatibility package (ghostlink-discord-compat-<X.Y.Z>.tgz,
# bots spec §4), then, after a maintainer approves the `release` environment:
#   - every file gets a detached Ed25519 signature (<file>.ed25519) from the release key, which
#     exists only as that environment's secret and never meets an npm install;
#   - checksums-sha256.txt covers all files and is signed with Ed25519 and with Sigstore (cosign keyless);
#     the app and install.sh install only a file listed there under its versioned name, and
#     scripts/verify-release.mjs refuses to publish a release they would reject;
#   - the GitHub release is published as a normal, *latest* release (electron-updater and
#     releases/latest ignore pre-releases and drafts; the "beta" label is in the title).
#   - the server's Docker image goes to ghcr.io/<owner>/ghostlink-server:<version> and :latest (one
#     digest, signed with cosign); the desktop app provisions and updates Railway servers from
#     exactly the version tag, so the release waits for it; :latest is for Docker hosts that
#     follow releases by themselves (Watchtower).
# Actions are pinned by commit SHA, every job has minimal permissions, untrusted values reach
# scripts only through env. scripts/test/releaseWorkflow.test.ts enforces these rules.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Flaky networks: npm retries each request before failing the whole install.
  npm_config_fetch_retries: '6'
  npm_config_fetch_retry_mintimeout: '5000'
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag, package versions and release notes agree
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs "$TAG" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in the release: nothing a branch build wrote may reach the installer.
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt ${attempt} of 3), retrying in 20 s"
            sleep 20
          done
          exit 1
      - name: Fetch LiveKit
        run: |
          if [ -f scripts/fetch-livekit.mjs ]; then
            node scripts/fetch-livekit.mjs
          else
            echo "::warning::scripts/fetch-livekit.mjs not found: the installer ships without LiveKit (no voice)."
          fi
      - name: Build the installer
        run: npm run dist
      - name: Smoke test the packaged app
        run: npm run smoke
      - name: Collect the update files
        run: |
          mkdir release
          for file in "GhostLink-Setup-${VERSION}.exe" "GhostLink-Setup-${VERSION}.exe.blockmap" latest.yml; do
            cp "apps/desktop/dist/${file}" release/
          done
          grep -Fx "version: ${VERSION}" release/latest.yml
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: release/
          if-no-files-found: error
          retention-days: 3

  server:
    name: Server package
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt ${attempt} of 3), retrying in 20 s"
            sleep 20
          done
          exit 1
      - name: Bundle the CLI
        run: npm run build -w @ghostlink/server
      - name: Package
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" node scripts/pack-server.mjs release
          test -f "release/ghostlink-server-${VERSION}.tgz"
      - name: Smoke test the package
        run: |
          mkdir "$RUNNER_TEMP/pkg"
          tar -xzf "release/ghostlink-server-${VERSION}.tgz" -C "$RUNNER_TEMP/pkg"
          test "$(node --disable-warning=ExperimentalWarning "$RUNNER_TEMP/pkg/dist/cli.js" version)" = "${VERSION}"
          # The Ghost DJ's LiveKit audio add-on loads from the package (ffmpeg may be missing here).
          dj="$(node --disable-warning=ExperimentalWarning "$RUNNER_TEMP/pkg/dist/cli.js" ghost-dj || true)"
          printf '%s\n' "$dj" | grep -Fx 'LiveKit audio (@livekit/rtc-node): ok'
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-server
          path: release/
          if-no-files-found: error
          retention-days: 3

  compat:
    name: Bot package (discord.js compatibility)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt ${attempt} of 3), retrying in 20 s"
            sleep 20
          done
          exit 1
      # prepack builds dist/ (ESM, CommonJS and types); bots install the .tgz from the release, never from npm.
      - name: Package
        run: |
          mkdir release
          npm pack -w @ghostlink/discord-compat --pack-destination release
          test -f "release/ghostlink-discord-compat-${VERSION}.tgz"
      - name: Smoke test the package as a bot installs it
        run: |
          mkdir "$RUNNER_TEMP/bot"
          cd "$RUNNER_TEMP/bot"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/release/ghostlink-discord-compat-${VERSION}.tgz"
          test "$(node -p "require('@ghostlink/discord-compat').version")" = "${VERSION}"
          test "$(node --input-type=module -e "import { version, Client } from '@ghostlink/discord-compat'; console.log(typeof Client === 'function' ? version : 'broken')")" = "${VERSION}"
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-compat
          path: release/
          if-no-files-found: error
          retention-days: 3

  sign:
    name: Sign
    needs: [version, windows, server, compat]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewer + v* tags only: the release key is released to this job after approval.
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing identity of this workflow
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node built-ins only from here on: no npm install runs next to the key.
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Ed25519 signatures and checksums
        env:
          RELEASE_ED25519_PRIVATE_KEY_PEM: ${{ secrets.RELEASE_ED25519_PRIVATE_KEY_PEM }}
        run: |
          node scripts/sign-release.mjs release/*
          node scripts/checksums.mjs release
          node scripts/sign-release.mjs release/checksums-sha256.txt
      # What the updater and install.sh require: signed checksums naming this version's files.
      - name: Check the release as clients will
        run: node scripts/verify-release.mjs release "$VERSION"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums with Sigstore
        working-directory: release
        run: cosign sign-blob --yes --bundle checksums-sha256.txt.sigstore.json checksums-sha256.txt
      - name: Verify what users will verify
        working-directory: release
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify-blob checksums-sha256.txt --bundle checksums-sha256.txt.sigstore.json \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum -c checksums-sha256.txt
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: release/
          if-no-files-found: error
          retention-days: 3

  image:
    name: Server image (GHCR)
    # After the approval: the image is what every Railway server created by the app runs.
    needs: [version, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless signature of the image
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/ghostlink-server
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Docker CLI of the runner only: no third-party build action.
      - name: Build the image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          docker build -f apps/server/docker/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -t "${IMAGE}:${VERSION}" .
      - name: Smoke test the image
        run: |
          test "$(docker run --rm --entrypoint node "${IMAGE}:${VERSION}" /opt/ghostlink/dist/cli.js version)" = "${VERSION}"
          # The Ghost DJ: ffmpeg and its LiveKit audio add-on are in the image.
          docker run --rm --entrypoint node "${IMAGE}:${VERSION}" /opt/ghostlink/dist/cli.js ghost-dj
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "${IMAGE}:${VERSION}"
          # The same image under the moving tag: Docker hosts that follow releases pull :latest.
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
          echo "DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}")" >> "$GITHUB_ENV"
          docker logout ghcr.io
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # One signature for both tags: cosign signs the digest that :<version> and :latest point to.
      - name: Sign the image with Sigstore
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          cosign sign --yes "$DIGEST"

  publish:
    name: Publish the GitHub release
    # The release waits for the image: an app version must never point at a missing image.
    needs: [version, sign, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the signed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: release
      # A normal release marked latest, never a pre-release or draft (spec §15). --verify-tag: the
      # protected tag must already exist; this job never creates one.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "GhostLink v${VERSION} (beta)" \
            --notes-file "release-notes/${VERSION}.md"
