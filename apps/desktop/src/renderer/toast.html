<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>GhostLink</title>
  </head>
  <body>
    <!-- GhostLink's own notifications (main/toasts.ts): up to three cards in the corner of the
         screen, the newest at the bottom. Never focused; their texts are set as text, never HTML. -->
    <ol id="stack" class="stack"></ol>
    <!-- The app's own notices show the ghost of build/icon.svg (the same drawing as splash.html). -->
    <template id="ghost">
      <svg class="ghost" viewBox="64 64 896 896" aria-hidden="true" focusable="false">
        <path d="M252 742V456A260 260 0 0 1 772 456V742A86.67 86.67 0 0 1 598.67 742A86.67 86.67 0 0 1 425.33 742A86.67 86.67 0 0 1 252 742Z" fill="#ffffff" />
        <ellipse cx="406" cy="480" rx="46" ry="64" fill="#1e1f22" />
        <ellipse cx="618" cy="480" rx="46" ry="64" fill="#1e1f22" />
      </svg>
    </template>
    <template id="close-icon">
      <svg class="closeIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
      </svg>
    </template>
    <script type="module" src="./toast/toast.ts"></script>
  </body>
</html>
